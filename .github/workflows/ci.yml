name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Serve site
        run: npx --yes http-server dist -p 4321 -s &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:4321/ >/dev/null && exit 0
            sleep 1
          done
          echo "site never came up"; exit 1

      - name: Pa11y a11y smoke
        run: npx --yes pa11y-ci --config .pa11yci.json
